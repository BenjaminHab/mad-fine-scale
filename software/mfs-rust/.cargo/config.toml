[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# replace STM32G0B1RETx with your chip as listed in `probe-rs chip list`
runner = [
  "probe-rs",
  "run",
  "--chip",
  "STM32G070CBTx",
  "--log-format",
  "{t}, {s}",
]

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
DEFMT_RTT_BUFFER_SIZE = "256"

[profile.release]
# Allows defmt to display log locations even in release
debug = true

[target.thumbv7m-none-eabi]
rustflags = [
  # --- KEEP existing `link-arg` flags ---
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",

  # --- ADD following new flag ---
  "-C", "link-arg=-Tdefmt.x",
]


